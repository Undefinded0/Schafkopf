<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Schafkopf-Stammtisch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schafkopf">
<meta name="theme-color" content="#3b2414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Layout: Wirtshaus-Tisch auf einem Bildschirm — Holzleiste oben, Filz mit drei Gegnern, Stich in der Mitte, dein Fächer unten.
   Bewusst ein einziges Farbthema (grüner Filz + Papier), unabhängig vom Systemthema. */
:root{
  --felt:#1f5d3d; --felt-hi:#2c7a51; --felt-deep:#113522;
  --wood:#4b2e19; --wood-hi:#6b4426; --wood-dk:#2d1b0e;
  --paper:#f7f0dd; --paper-2:#ece2c6; --card-bg:#fffdf7; --ink:#2b2118; --ink-soft:#6a5a48; --line:#0000001f;
  --gold:#e2b23f; --red:#b8322a; --green-ok:#2b7a2f;
  --f-display:'Grenze Gotisch', Georgia, 'Times New Roman', serif;
  --f-body:'Alegreya Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --cw: clamp(40px, min(16vw, 10.5vh), 112px);   /* Karten im Stich */
  --hw: clamp(52px, min(22.5vw, 15.5vh), 138px); /* Karten in deiner Hand */
  color-scheme: dark;
}
html,body{height:100%}
body{margin:0;background:var(--felt-deep);color:var(--paper);font-family:var(--f-body);font-size:16px;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{-webkit-user-drag:none}

#app{height:100%;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding-block:6px;min-height:44px;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));
  background:linear-gradient(180deg,var(--wood-hi),var(--wood));border-bottom:2px solid var(--wood-dk);box-shadow:0 2px 8px #0006;z-index:5}
#brand{font-family:var(--f-display);font-size:23px;font-weight:800;color:var(--gold);line-height:1;white-space:nowrap}
#wallet{display:flex;align-items:center;gap:6px;border:0;border-radius:99px;background:#0000004d;padding:6px 11px 6px 8px;font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:inset 0 0 0 1px #ffffff26}
#wallet .coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a6,#d9a62c 60%,#9a6f12);box-shadow:inset 0 0 0 1.5px #8a5e0a}
#wallet.neg{color:#ffb4ac}
#wallet .stk{font-weight:600;opacity:.75;font-size:12.5px}
.spacer{flex:1}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:40px;border:0;border-radius:10px;background:#00000033;
  box-shadow:inset 0 0 0 1px #ffffff2e;padding:0 10px;font-weight:700;font-size:14px}
.ib svg{width:22px;height:22px;flex:none}
.ib:disabled{opacity:.35;cursor:default}
.ib .t{display:none}
@media (min-width:820px){.ib .t{display:inline}}

#ginfo{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 8px;font-size:14px;line-height:1.25;padding-block:5px;min-height:30px;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));background:#0000003d;z-index:4;text-align:center}
#ginfo b{color:#fff}
.chip{font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--gold);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}
.chip.soft{background:#ffffff22;color:var(--paper)}

#table{flex:1;position:relative;min-height:0;
  background:radial-gradient(ellipse 80% 70% at 50% 48%, var(--felt-hi) 0%, var(--felt) 55%, var(--felt-deep) 100%)}
#table::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:repeating-linear-gradient(45deg,#000 0 1px,transparent 1px 3px)}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;max-width:31%}
#seat2{top:8px;left:50%;transform:translateX(-50%);max-width:70%}
#seat1{left:max(8px, env(safe-area-inset-left, 0px));top:30%}
#seat3{right:max(8px, env(safe-area-inset-right, 0px));top:30%}
.plate{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 6px;background:#0000004d;border:1px solid #ffffff22;
  border-radius:12px;padding:4px 10px;font-size:13px;white-space:nowrap;transition:box-shadow .2s, border-color .2s}
.plate b{font-size:15px}
.plate .tk{opacity:.8;font-size:12px;font-variant-numeric:tabular-nums}
.turn .plate,.plate.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 16px #e2b23f88}
.tag{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.tag.pl{background:var(--gold);color:var(--ink)}
.tag.pa{background:#fff;color:var(--ink)}
.tag.dl{background:#ffffff26;color:var(--paper)}
.cards{display:flex;justify-content:center}
.seat .cards>*+*{margin-left:calc(var(--w) * -.66)}
.seat .cards.open{flex-wrap:wrap;max-width:calc(var(--cw) * 2.6);row-gap:3px}
.seat .cards.open>*+*{margin-left:calc(var(--w) * -.45)}
#seat2 .cards.open{max-width:none}

.bubble{position:absolute;z-index:6;background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:6px 12px;border-radius:14px;
  white-space:nowrap;box-shadow:0 3px 10px #0007;opacity:0;transform:scale(.8);transition:opacity .2s, transform .2s;pointer-events:none}
.bubble.show{opacity:1;transform:scale(1)}
#seat2 .bubble{top:100%;margin-top:4px}
#seat1 .bubble{top:100%;left:0;margin-top:4px}
#seat3 .bubble{top:100%;right:0;margin-top:4px}
#me .bubble{bottom:100%;left:50%;transform:translateX(-50%) scale(.8);margin-bottom:4px}
#me .bubble.show{transform:translateX(-50%) scale(1)}

.trick{position:absolute;left:50%;top:56%;width:calc(var(--cw) * 3.3);height:calc(var(--cw) * 3.05);transform:translate(-50%,-50%);z-index:1}
.slot{position:absolute}
.slot0{left:50%;bottom:0;transform:translateX(-50%)}
.slot2{left:50%;top:0;transform:translateX(-50%)}
.slot1{left:0;top:50%;transform:translateY(-50%) rotate(-7deg)}
.slot3{right:0;top:50%;transform:translateY(-50%) rotate(7deg)}
.fly{animation:fly .32s cubic-bezier(.2,.8,.3,1) both}
.f0{--fx:0;--fy:150%}.f1{--fx:-170%;--fy:0}.f2{--fx:0;--fy:-150%}.f3{--fx:170%;--fy:0}
@keyframes fly{from{transform:translate(var(--fx),var(--fy)) scale(.85);opacity:.2}to{transform:none;opacity:1}}
.slot>div{transition:transform .45s ease-in, opacity .45s ease-in}
.trick.go .slot>div{opacity:0}
.trick.g0 .slot>div{transform:translateY(260%) scale(.4)}
.trick.g1 .slot>div{transform:translateX(-300%) scale(.4)}
.trick.g2 .slot>div{transform:translateY(-260%) scale(.4)}
.trick.g3 .slot>div{transform:translateX(300%) scale(.4)}
.slot.win .card{box-shadow:0 0 0 3px var(--gold),0 6px 18px #000a}

#msg{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:4;width:max-content;max-width:min(92%,560px);text-align:center;
  background:#000000b3;color:#fff;border-radius:12px;padding:7px 13px;font-size:15px;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none}
#msg.show{opacity:1}
#msg.warn{background:#7d1d17ee}
#msg.tip{background:#5a4510f2}

#me{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px;
  padding-bottom:max(8px, env(safe-area-inset-bottom, 0px));
  padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));
  background:linear-gradient(180deg,#0000,#00000059)}
#hand{position:relative;width:100%;max-width:980px;height:calc(var(--hw) * 1.55 + 26px);touch-action:none}
#hand .card{--w:var(--hw);position:absolute;left:0;bottom:4px;transform-origin:50% 120%;
  transform:translate(var(--x,0px), calc(var(--dy,0px) + var(--lift,0px))) rotate(var(--rot,0deg));
  transition:transform .16s ease-out, filter .15s;cursor:pointer}
#hand.nt .card{transition:none}
@media (hover:hover){#hand .card.playable:hover{--lift:-12px}}
@media (max-width:420px){#brand{font-size:19px}#walStk{display:none}#bar{gap:6px}.ib{min-width:42px;padding:0 8px}}
#hand .card.sel{--lift:-26px;box-shadow:0 0 0 3px var(--gold),0 10px 18px #000a}
#hand .card.dim{filter:brightness(.6) saturate(.55)}
#hand .card.hint{--lift:-16px;box-shadow:0 0 0 3px #7fd3ff,0 0 18px #7fd3ffaa}
#hand .card.shake{animation:shake .35s}
@keyframes shake{25%{translate:-7px 0}50%{translate:7px 0}75%{translate:-3px 0}}
#handHint{font-size:12px;opacity:.7;height:14px;line-height:14px}

/* Karten */
.card{--w:var(--cw);position:relative;width:var(--w);height:calc(var(--w) * 1.55);border-radius:calc(var(--w) * .07);background:var(--card-bg);
  box-shadow:0 2px 6px #0008;overflow:hidden;flex:none}
.card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .tmark{position:absolute;left:0;top:0;bottom:0;width:calc(var(--w) * .055);background:var(--gold);box-shadow:1px 0 0 #0004}
.card.mini{--w:calc(var(--cw) * .5)}
.card.tc{--w:calc(var(--cw) * .98)}
.card.lst{--w:calc(var(--cw) * .72)}
.back{--w:calc(var(--cw) * .42);width:var(--w);height:calc(var(--w) * 1.55);border-radius:calc(var(--w) * .1);flex:none;
  background:radial-gradient(circle at 50% 50%,#ffffff22 0 18%,transparent 19%),repeating-linear-gradient(45deg,#1f4f86 0 3px,#173c69 3px 6px),repeating-linear-gradient(-45deg,#1f4f86 0 3px,#173c69 3px 6px);
  box-shadow:0 1px 4px #0008, inset 0 0 0 2px #fbf6ea, inset 0 0 0 3px #173c69}

/* Papier-Flächen */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;width:min(470px, calc(100% - 28px));max-height:calc(100% - 16px);overflow:auto;
  background:var(--paper);color:var(--ink);border-radius:18px;box-shadow:0 12px 40px #000a, inset 0 0 0 1px #0000001a;padding:18px 18px 16px;
  animation:pop .22s ease-out;user-select:text;-webkit-user-select:text;-webkit-overflow-scrolling:touch}
@keyframes pop{from{transform:translate(-50%,-45%);opacity:0}}
@media (max-width:640px){
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;transform:none;border-radius:20px 20px 0 0;max-height:calc(100% - 8px);
    padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));animation:slideup .25s ease-out}
  @keyframes slideup{from{transform:translateY(40%);opacity:0}}
}
.panel h2,.panel h3,.sheet h2,.sheet h3{font-family:var(--f-display);font-weight:800;margin:0 0 6px;text-wrap:balance;color:var(--wood)}
.panel h2{font-size:34px}.panel h3{font-size:26px}
.panel p{margin:6px 0;line-height:1.4}
.small{font-size:13.5px;color:var(--ink-soft)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btns button,.btn{flex:1 1 auto;min-height:46px;border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:16px;background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 1px #00000026}
.btns button.pri,.btn.pri{background:var(--wood);color:var(--paper);box-shadow:none}
.btns button:active{filter:brightness(.95)}
.grp{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:9px 0}
.grp>span{width:100%;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft)}
.gb{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;border-radius:12px;padding:6px 12px;font-weight:700;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #00000030}
.gb img{width:22px;height:22px}
.gb small{font-weight:500;color:var(--ink-soft)}
.gb:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--wood)}
.gb:disabled{opacity:.36;cursor:not-allowed}
.sugg{background:#fff4cc;border-radius:10px;padding:8px 12px;font-size:15px}
.toutline{display:flex;align-items:center;gap:10px;font-weight:700;margin-top:8px;min-height:40px}
.toutline input{width:22px;height:22px;accent-color:var(--wood)}
.res-head{font-size:19px;font-weight:800;line-height:1.3}
.win{color:var(--green-ok)} .lose{color:var(--red)}
.money{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}
table.t{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right}
table.t tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.pos{color:var(--green-ok);font-weight:700}.neg{color:var(--red);font-weight:700}
.trow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trow .lbl{width:100%;font-size:13.5px;font-weight:700}
.trow .who{font-size:11px;text-align:center;color:var(--ink-soft)}
.trow .cw{display:flex;flex-direction:column;align-items:center;gap:2px}
.trow .cw.w .card{box-shadow:0 0 0 2px var(--gold),0 2px 6px #0006}

/* Vollbild-Blätter: Menü, Einstellungen, Regeln */
#modal{position:fixed;inset:0;z-index:20;background:#000000a6;display:flex;align-items:center;justify-content:center;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-block:max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px))}
.sheet{position:relative;background:#efe7d3;color:var(--ink);border-radius:18px;width:min(700px,100%);max-height:100%;overflow:auto;padding:0 0 22px;
  box-shadow:0 12px 40px #000;user-select:text;-webkit-user-select:text;-webkit-overflow-scrolling:touch}
@media (max-width:640px){#modal{padding:0;align-items:stretch}.sheet{border-radius:0;max-height:none;height:100%;padding-bottom:max(22px, env(safe-area-inset-bottom, 0px))}}
.shead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;background:#efe7d3f2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:10px 16px;padding-top:max(10px, env(safe-area-inset-top, 0px));border-bottom:1px solid var(--line)}
.shead h2{flex:1;margin:0;font-size:28px}
.shead button{border:0;border-radius:10px;min-height:40px;padding:0 14px;font-weight:800;background:var(--wood);color:var(--paper)}
.sbody{padding:6px 16px 0}
.sheet p,.sheet li{line-height:1.5;max-width:68ch}
.sheet h3{font-size:22px;margin:20px 0 6px}
.sheet ul{padding-left:20px;margin:6px 0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.menu button{border:0;border-radius:16px;padding:16px;text-align:left;background:#fff;box-shadow:0 1px 0 #0000001a;min-height:76px}
.menu button b{display:block;font-size:18px;color:var(--wood)}
.menu button span{font-size:13.5px;color:var(--ink-soft)}
/* iOS-artige Einstellungsgruppen */
.sec{margin:18px 0 6px;padding:0 6px;font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft)}
.group{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 0 #0000001a}
.rowi{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-bottom:1px solid #0000000f}
.rowi:last-child{border-bottom:0}
.rowi .lab{flex:1;min-width:0}
.rowi .lab b{display:block;font-weight:700;font-size:16px}
.rowi .lab small{display:block;color:var(--ink-soft);font-size:13px;line-height:1.3}
.rowi.col{flex-direction:column;align-items:stretch}
.rowi button.link{border:0;background:none;color:var(--wood);font-weight:800;padding:8px 0;text-align:left;min-height:40px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:#d5ccb8;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw input:checked+span{background:var(--green-ok)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:flex;background:#e9e1cd;border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:36px;padding:4px 10px;font-weight:700;font-size:14.5px;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 1px 3px #0003}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:38px;height:38px;border:0;border-radius:10px;background:#e9e1cd;font-size:20px;font-weight:800;color:var(--ink)}
.stepper output{min-width:66px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.stakes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stake{border:0;border-radius:14px;padding:10px 12px;text-align:left;background:#f6f0e2;box-shadow:inset 0 0 0 1px #00000020;min-height:64px}
.stake b{display:block;font-size:15px}
.stake span{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stake.on{background:var(--wood);color:var(--paper);box-shadow:none}
.stake.on span{color:#f2dfbd}
.bal{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--wood);line-height:1.1}
.bal.neg{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px}
.stats div{background:#fff;border-radius:12px;padding:8px 12px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink-soft)}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.dslot{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink-soft)}
.dslot .card{--w:72px}
.dslot.own .card{box-shadow:0 0 0 2px var(--green-ok),0 2px 6px #0006}
.ladder{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end}
.ladder .card{--w:calc(var(--cw) * .66)}
kbd{font-family:inherit;font-weight:800;background:var(--paper-2);border-radius:4px;padding:0 4px}
.credit{font-size:12px;color:var(--ink-soft);margin-top:14px}

@media (max-height:500px) and (orientation:landscape){
  :root{--hw: clamp(46px, min(13vw, 21vh), 110px); --cw: clamp(36px, 12vh, 80px)}
  #seat1,#seat3{top:12%}
  #ginfo{min-height:24px;padding-block:2px;font-size:13px}
  #handHint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .fly,.panel,.shake{animation:none}
  .slot>div,#hand .card,.bubble{transition:none}
}
</style>

<div id="app">
  <header id="bar">
    <div id="brand">Schafkopf</div>
    <button id="wallet" aria-label="Spielgeld und Einsatz"><span class="coin"></span><span id="walBal">50,00 €</span><span class="stk" id="walStk"></span></button>
    <div class="spacer"></div>

const IDB={db:null,

function processImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth,h=im.naturalHeight,rot=w>h*1.08;
      const sw=rot?h:w, sh=rot?w:h, ratio=1.55;
      let cw=sw,ch=sw*ratio; if(ch>sh){ch=sh;cw=sh/ratio;}
      const W=360,H=Math.round(W*ratio), cv=document.createElement('canvas');cv.width=W;cv.height=H;
      const g=cv.getContext('2d');
      g.save();
      if(rot){g.translate(W,0);g.rotate(Math.PI/2);g.scale(H/ch,W/cw);g.drawImage(im,(w-ch)/2,(h-cw)/2,ch,cw,0,0,ch,cw);}
      else{g.scale(W/cw,H/ch);g.drawImage(im,(w-cw)/2,(h-ch)/2,cw,ch,0,0,cw,ch);}
      g.restore();URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',.86));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Bild konnte nicht gelesen werden'));};
    im.src=url;
  });
}
function matchName(name){

  if(/eichel|acorn/.test(n))s='E';else if(/gras|gruen|laub|blatt|leaf|green/.test(n))s='G';else if(/herz|heart|rot/.test(n))s='H';else if(/schell|bell/.test(n))s='S';
  const t=n.split(/[^a-z0-9]+/);
  let r=null;
  if(/sau|ass\b|ace|daus/.test(n)||t.includes('a'))r='A';
  else if(/zehn|\b10\b/.test(n)||t.includes('10'))r='10';
  else if(/koenig|king/.test(n)||t.includes('k'))r='K';
  else if(/ober/.test(n)||t.includes('o'))r='O';
  else if(/unter/.test(n)||t.includes('u'))r='U';
  else if(/neun/.test(n)||t.includes('9'))r='9';
  else if(/acht/.test(n)||t.includes('8'))r='8';
  else if(/sieben/.test(n)||t.includes('7'))r='7';
  if(!s){const m=t.find(x=>/^[eghs]$/.test(x));if(m)s=m.toUpperCase();}
  return s&&r?s+r:null;
}

/* ================= Spielarten ================= */
function makeGame(d){
  const g=Object.assign({},d), ranks=deckRanks();
  const OS=SUITS.map(s=>s+'O'), US=SUITS.map(s=>s+'U');
  const suitCards=(s,ex)=>ORDER.filter(r=>ranks.includes(r)&&!ex.includes(r)).map(r=>s+r);
  let tr=[];
  switch(d.type){
    case 'sauspiel': case 'ramsch': tr=[...OS,...US,...suitCards('H',['O','U'])];break;
    case 'solo': tr=[...OS,...US,...suitCards(d.suit,['O','U'])];break;
    case 'wenz': tr=US;break;
    case 'farbwenz': tr=[...US,...suitCards(d.suit,['U'])];break;
    case 'geier': tr=OS;break;
    case 'farbgeier': tr=[...OS,...suitCards(d.suit,['O'])];break;
    default: tr=[];
  }
  g.trumps=tr; g.ti=new Map(tr.map((id,i)=>[id,i]));
  const ord=d.type==='bettel'?['A','K','O','U','10','9','8','7']:ORDER;
  g.si=new Map();
  for(const s of SUITS){let i=0;for(const r of ord){if(ranks.includes(r)&&!g.ti.has(s+r))g.si.set(s+r,i++);}}
  return g;
}
function gameLabel(g){
  if(g.sie) return 'Sie';
  const t=g.tout?' Tout':'';
  switch(g.type){
    case 'sauspiel': return `Sauspiel auf die ${SN[g.called]}-Sau`;
    case 'solo': return `${SN[g.suit]}-Solo${t}`;
    case 'wenz': return `Wenz${t}`;
    case 'geier': return `Geier${t}`;
    case 'farbwenz': return `${SN[g.suit]}-Wenz${t}`;
    case 'farbgeier': return `${SN[g.suit]}-Geier${t}`;
    case 'bettel': return 'Bettel';
    case 'ramsch': return 'Ramsch';
  }
  return '';
}
function announceText(g){
  const nick={E:'die Alte',G:'die Blaue',S:'die Schelln'};
  if(g.type==='sauspiel') return `Auf ${nick[g.called]}!`;
  return `I spui ${gameLabel(g)}!`;
}
const declRank=d=>d.sie?9:(d.tout?4:RANKOF[d.type]);
const isT=(c,g=S.game)=>g.ti.has(c.id);
const eff=(c,g=S.game)=>g.ti.has(c.id)?'T':c.s;
function power(c,lead,g=S.game){if(g.ti.has(c.id))return 1000-g.ti.get(c.id);if(c.s===lead)return 100-g.si.get(c.id);return -1;}
function trickWinnerIdx(tr,g=S.game){const lead=eff(tr[0].c,g);let b=0;for(let i=1;i<tr.length;i++)if(power(tr[i].c,lead,g)>power(tr[b].c,lead,g))b=i;return b;}
function sortHand(h,g=S.game){
  const key=c=>g.ti.has(c.id)?g.ti.get(c.id):100+SORT_SUITS.indexOf(c.s)*20+g.si.get(c.id);
  h.sort((a,b)=>key(a)-key(b));
}
function callable(hand){
  return ['E','G','S'].filter(s=>!hand.some(c=>c.id===s+'A')&&hand.some(c=>c.s===s&&c.r!=='O'&&c.r!=='U'));
}

/* ================= Regeln: erlaubte Karten ================= */
function rules(p){
  const hand=S.hands[p], g=S.game, tr=S.trick, why={};
  const ruf=g.type==='sauspiel'?g.called:null, sauId=ruf?ruf+'A':null;
  const restricted=ruf&&hand.some(c=>c.id===sauId)&&!S.davon;
  const runN=settings.kurz?3:4;
  if(!tr.length){
    if(restricted){
      const rc=hand.filter(c=>eff(c)===ruf);
      if(rc.length<runN) for(const c of rc) if(c.id!==sauId)
        why[c.id]=`Du hast die gerufene Sau: Die Ruffarbe darfst du nur mit der Sau ausspielen. Davonlaufen geht erst ab ${runN} Karten dieser Farbe.`;
    }
  }else{
    const lead=eff(tr[0].c);
    const fol=hand.filter(c=>eff(c)===lead);
    if(fol.length){
      for(const c of hand) if(eff(c)!==lead)
        why[c.id]=lead==='T'?'Trumpf ist ausgespielt: Du musst Trumpf zugeben.':`${SN[lead]} ist ausgespielt: Du musst Farbe bekennen.`;
      if(restricted&&lead===ruf) for(const c of fol) if(c.id!==sauId)
        why[c.id]='Die Ruffarbe ist gesucht: Du musst die gerufene Sau zugeben.';
    }else if(restricted&&hand.length>1){
      why[sauId]='Die gerufene Sau darfst du nicht abwerfen (erst im letzten Stich).';
    }
  }
  return {legal:hand.filter(c=>!why[c.id]),why};
}
function applyCard(p,c){
  const g=S.game;
  S.hands[p]=S.hands[p].filter(x=>x.id!==c.id);
  if(S.trick.length){
    const lead=eff(S.trick[0].c); if(eff(c)!==lead) S.voids[p][lead]=true;
  }else{
    const e=eff(c); S.ledCount[e]=(S.ledCount[e]||0)+1;
    if(g.type==='sauspiel'&&e===g.called){
      S.rufLed=true;
      if(c.id!==g.called+'A'&&S.hands[p].some(x=>x.id===g.called+'A')){S.davon=true;S.justRan=p;}
    }
  }
  if(g.type==='sauspiel'&&c.id===g.called+'A'&&!S.revealed){S.revealed=true;S.justRevealed=p;}
  S.trick.push({p,c}); S.played.add(c.id);
}

/* ================= Wissen der Computerspieler ================= */
function relation(p,q){
  if(p===q) return 1;
  const g=S.game;
  if(g.type==='ramsch') return -1;
  if(g.type!=='sauspiel'||S.revealed) return S.team[p]===S.team[q]?1:-1;
  const holder=S.start[p].some(c=>c.id===g.called+'A');
  if(p===g.player) return 0;
  if(holder) return q===g.player?1:-1;
  return q===g.player?-1:0;
}
function unseen(p){const h=new Set(S.hands[p].map(c=>c.id));return DECK.filter(c=>!S.played.has(c.id)&&!h.has(c.id));}
function canBeBeaten(p,card,lead,foes){
  if(!foes.length) return false;
  const pc=power(card,lead);
  for(const u of unseen(p)){
    if(power(u,lead)<=pc) continue;
    const e=eff(u);
    if(foes.some(q=>!S.voids[q][e])) return true;
  }
  return false;
}
function isTop(p,c){const e=eff(c);return !unseen(p).some(u=>eff(u)===e&&power(u,e)>power(c,e));}
function strength(c){const g=S.game;return g.ti.has(c.id)?10+(g.trumps.length-g.ti.get(c.id))*2:(8-g.si.get(c.id))*.5;}
const cost=c=>PTS[c.r]+strength(c);
function discardCost(p,c){let v=cost(c);if(!isT(c)){const n=S.hands[p].filter(x=>!isT(x)&&x.s===c.s).length;if(n===1&&c.r!=='A')v-=1.5;}return v;}
const R=(c,why)=>{AIR=why;return c;};

/* ================= Computer: Karte wählen ================= */
function aiPlay(p){
  const L=rules(p).legal;
  if(L.length===1) return R(L[0],'Nur diese Karte ist erlaubt.');
  const t=S.game.type;
  if(t==='bettel') return aiBettel(p,L);
  if(t==='ramsch') return aiRamsch(p,L);
  return S.trick.length?aiFollow(p,L):aiLead(p,L);
}
function aiLead(p,L){
  const g=S.game, me=S.team[p], hand=S.hands[p];
  const T=L.filter(c=>isT(c)), N=L.filter(c=>!isT(c));
  const unT=unseen(p).filter(u=>isT(u)).length;
  const fresh=N.filter(c=>c.r==='A'&&!S.ledCount[c.s]);
  const sideLen=s=>hand.filter(x=>!isT(x)&&x.s===s).length;
  if(me){
    if(T.length&&unT>0){
      const hi=maxBy(T,c=>power(c,'T'));
      if(isTop(p,hi)) return R(hi,'Höchster Trumpf im Spiel: Trumpf ziehen, damit den Gegnern die Trümpfe ausgehen.');
      if(g.type==='sauspiel'&&p!==g.player) return R(hi,'Als Partner Trumpf spielen, um den Spieler zu unterstützen.');
      if(T.length>=2||g.type!=='sauspiel') return R(minBy(T,cost),'Mit einem kleinen Trumpf die hohen Trümpfe der Gegner herauslocken.');
    }
    if(T.length&&unT===0) return R(maxBy(T,c=>power(c,'T')),'Die Gegner haben keinen Trumpf mehr: Dein Trumpf sticht sicher.');
    if(fresh.length) return R(minBy(fresh,c=>sideLen(c.s)),'Die Sau einer noch ungespielten Farbe holt meist den Stich.');
    const tops=N.filter(c=>isTop(p,c));
    if(tops.length) return R(maxBy(tops,c=>PTS[c.r]),'Diese Karte ist in ihrer Farbe die höchste, die noch im Spiel ist.');
    return R(minBy(L,c=>discardCost(p,c)),'Eine billige Karte abgeben, die wenig Augen kostet.');
  }
  if(g.type==='sauspiel'&&!S.rufLed){
    const rc=N.filter(c=>c.s===g.called);
    if(rc.length) return R(minBy(rc,c=>PTS[c.r]),'Rufsau suchen: Spiel die Ruffarbe an, dann muss der Partner seine Sau zugeben.');
  }
  if(fresh.length) return R(minBy(fresh,c=>sideLen(c.s)),'Die Sau einer frischen Farbe anspielen, solange sie noch nicht gestochen werden kann.');
  const tops=N.filter(c=>isTop(p,c));
  if(tops.length) return R(tops[0],'Diese Karte ist in ihrer Farbe die höchste, die noch im Spiel ist.');
  if(N.length) return R(minBy(N,c=>discardCost(p,c)),'Als Gegenspieler lieber Farbe statt Trumpf anspielen und billig bleiben.');
  return R(minBy(T,cost),'Nur noch Trümpfe: den billigsten nehmen.');
}
function aiFollow(p,L){
  const tr=S.trick, lead=eff(tr[0].c), wi=trickWinnerIdx(tr), w=tr[wi].p, wc=tr[wi].c;
  const tp=tr.reduce((s,x)=>s+PTS[x.c.r],0);
  const after=[];for(let k=tr.length+1;k<4;k++)after.push((tr[0].p+k)%4);
  const foes=after.filter(q=>relation(p,q)!==1);
  const rel=relation(p,w);
  const beats=c=>power(c,lead)>power(wc,lead);
  const W=L.filter(beats), NW=L.filter(c=>!beats(c));
  const cheap=a=>minBy(a,c=>discardCost(p,c));
  const held=c=>!canBeBeaten(p,c,lead,foes);
  if(rel===1){
    if(held(wc)) return R(maxBy(L,c=>PTS[c.r]-(isT(c)?strength(c)*.7:0)),`${w===0?'Du hast':NAMES[w]+' hat'} den Stich sicher und spielt mit dir: Schmieren, also viele Augen dazugeben.`);
    const sw=W.filter(held);
    if(sw.length&&tp>=10) return R(minBy(sw,cost),'Der Stich ist wertvoll und dein Mitspieler nicht sicher: sicher übernehmen.');
    return R(cheap(NW.length?NW:L),'Dein Mitspieler liegt vorn: nicht überstechen, billig zugeben.');
  }
  if(W.length){
    const sw=W.filter(held);
    if(sw.length){
      const c=minBy(sw,cost);
      if(tp>=3||cost(c)<14||(rel===-1&&!foes.length)) return R(c,foes.length?'Mit der billigsten Karte stechen, die nicht mehr überstochen werden kann.':'Du bist als Letzter dran: billig stechen und die Augen holen.');
    }
    const ace=W.find(c=>!isT(c)&&c.r==='A'&&!foes.some(q=>S.voids[q][lead])&&(S.ledCount[lead]||0)<=1);
    if(ace) return R(ace,'Erste Runde dieser Farbe: Die Sau holt den Stich wahrscheinlich.');
    if(tp>=10&&rel===-1) return R(maxBy(W,c=>power(c,lead)),'Viele Augen im Stich: hoch stechen und hoffen, dass keiner drüber kommt.');
  }
  return R(cheap(NW.length?NW:L),'Der Stich ist nicht zu halten: billig abwerfen.');
}
function aiRamsch(p,L){
  const tr=S.trick;
  if(!tr.length) return R(minBy(L,c=>strength(c)*3+PTS[c.r]*.3),'Ramsch: niedrig anspielen, damit ein anderer den Stich nehmen muss.');
  const lead=eff(tr[0].c), wc=tr[trickWinnerIdx(tr)].c;
  const NW=L.filter(c=>power(c,lead)<=power(wc,lead));
  if(NW.length) return R(maxBy(NW,c=>PTS[c.r]+strength(c)*.8),'Ramsch: Ein anderer nimmt den Stich, also hohe Karten und Augen loswerden.');
  if(tr.length===3) return R(minBy(L,c=>PTS[c.r]*2+strength(c)*.1),'Ramsch: Du musst stechen, also mit möglichst wenig Augen.');
  return R(minBy(L,c=>power(c,lead)),'Ramsch: knapp stechen, vielleicht sticht noch einer drüber.');
}
function aiBettel(p,L){
  const g=S.game, tr=S.trick, pl=g.player;
  const pw=c=>power(c,c.s);
  if(p===pl){
    if(!tr.length) return R(minBy(L,pw),'Bettel: die niedrigste Karte anspielen.');
    const lead=eff(tr[0].c), wc=tr[trickWinnerIdx(tr)].c;
    const NW=L.filter(c=>power(c,lead)<power(wc,lead));
    return NW.length?R(maxBy(NW,pw),'Bettel: die höchste Karte spielen, die noch unter dem Stich bleibt.'):R(maxBy(L,pw),'Bettel: Der Stich ist leider nicht zu vermeiden.');
  }
  if(!tr.length){const cand=L.filter(c=>!S.voids[pl][c.s]);return R(minBy(cand.length?cand:L,pw),'Gegen Bettel: niedrig anspielen, damit der Spieler drüber muss.');}
  const lead=eff(tr[0].c), wi=trickWinnerIdx(tr), w=tr[wi].p, wc=tr[wi].c;
  if(tr.some(x=>x.p===pl)){
    if(w===pl){const NW=L.filter(c=>power(c,lead)<power(wc,lead));if(NW.length)return R(maxBy(NW,pw),'Der Bettel-Spieler liegt vorn: drunter bleiben, damit er den Stich bekommt.');return R(minBy(L,pw),'Leider musst du drüber.');}
    return R(maxBy(L,pw),'Der Spieler liegt schon drunter: hohe Karte loswerden.');
  }
  return R(minBy(L,pw),'Gegen Bettel: niedrig bleiben, damit der Spieler drüber muss.');
}

/* ================= Computer: Spiel ansagen ================= */
function evalOU(hand,ts){
  const W={EO:4,GO:3.5,HO:3,SO:2.8,EU:2.5,GU:2.3,HU:2.1,SU:2};
  let sc=0,tc=0;
  for(const c of hand){
    if(c.r==='O'||c.r==='U'){sc+=W[c.id];tc++;}
    else if(c.s===ts){sc+=({A:1.6,'10':1.5,K:1.3}[c.r]||1.1);tc++;}
    else if(c.r==='A') sc+=1.5;
    else if(c.r==='10'&&hand.some(x=>x.id===c.s+'A')) sc+=.8;
  }
  for(const s of SUITS){if(s===ts)continue;if(!hand.some(c=>c.s===s&&c.r!=='O'&&c.r!=='U'))sc+=.5;}
  return {sc,tc};
}
function evalW(hand,key,ts){
  const W={E:4,G:3.5,H:3,S:2.8}, ranks=deckRanks();
  const ord=ORDER.filter(r=>r!==key&&ranks.includes(r));
  let sc=0,tc=0;
  for(const c of hand){
    if(c.r===key){sc+=W[c.s];tc++;}
    else if(ts&&c.s===ts){sc+=({A:1.6,'10':1.5,K:1.3}[c.r]||1.1);tc++;}
  }
  for(const s of SUITS){
    if(s===ts) continue;
    const have=new Set(hand.filter(c=>c.s===s&&c.r!==key).map(c=>c.r));
    let k=0;for(const r of ord){if(have.has(r))k++;else break;}
    if(k) sc+=2+(k-1)*1.3;
    if(k&&have.size>=4) sc+=(have.size-3)*.8;
    if(!have.size&&ts) sc+=.6;
  }
  return {sc,tc};
}
function toutable(hand,g){
  const has=new Set(hand.map(c=>c.id));
  let k=0;for(const id of g.trumps){if(has.has(id))k++;else break;}
  const tc=hand.filter(c=>g.ti.has(c.id)).length, oppT=g.trumps.length-tc;
  if(oppT>0&&k<oppT) return false;
  for(const s of SUITS){
    const side=[...g.si.entries()].filter(([id])=>id[0]===s).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    const held=side.filter(id=>has.has(id));
    for(let i=0;i<held.length;i++) if(side[i]!==held[i]) return false;
  }
  return true;
}
function bettelable(hand){
  if(hand.some(c=>c.r==='A'||c.r==='K')) return false;
  const g=makeGame({type:'bettel'});
  for(const s of SUITS){
    const side=[...g.si.entries()].filter(([id])=>id[0]===s).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const held=side.map((id,pos)=>({id,pos})).filter(x=>hand.some(c=>c.id===x.id));
    for(let j=0;j<held.length;j++) if(held[j].pos>j*2) return false;
  }
  return true;
}
function aiDecide(p){
  const hand=S.hands[p], hs=hand.length<8?.9:1, c=[];
  for(const s of SUITS){const {sc,tc}=evalOU(hand,s);if(tc>=Math.ceil(5*hs)&&sc>=16*hs)c.push({type:'solo',suit:s,m:sc-16*hs});}
  if(settings.wenz){const {sc,tc}=evalW(hand,'U',null);if(tc>=2&&sc>=13*hs&&(tc>=3||hand.some(x=>x.id==='EU'||x.id==='GU')))c.push({type:'wenz',m:sc-13*hs});}
  if(settings.geier){const {sc,tc}=evalW(hand,'O',null);if(tc>=2&&sc>=13*hs&&(tc>=3||hand.some(x=>x.id==='EO'||x.id==='GO')))c.push({type:'geier',m:sc-13*hs});}
  for(const s of SUITS){
    if(settings.farbwenz){const {sc,tc}=evalW(hand,'U',s);if(tc>=Math.ceil(5*hs)&&sc>=16*hs)c.push({type:'farbwenz',suit:s,m:sc-16*hs});}
    if(settings.farbgeier){const {sc,tc}=evalW(hand,'O',s);if(tc>=Math.ceil(5*hs)&&sc>=16*hs)c.push({type:'farbgeier',suit:s,m:sc-16*hs});}
  }
  if(settings.tout) for(const x of c) if(toutable(hand,makeGame(x))){x.tout=true;x.m+=20;}
  if(c.length){const b=maxBy(c,x=>declRank(x)*100+x.m);delete b.m;return b;}
  if(settings.bettel&&bettelable(hand)) return {type:'bettel'};
  const {sc,tc}=evalOU(hand,'H'), calls=callable(hand);
  if(calls.length&&tc>=Math.ceil(4*hs)&&sc>=9.5*hs){
    const called=minBy(calls,s=>hand.filter(x=>x.s===s&&x.r!=='O'&&x.r!=='U').length*10+(hand.some(x=>x.id===s+'10')?3:0));
    return {type:'sauspiel',called};
  }
  return null;
}
function aiKlopf(p){const h=S.hands[p];const {sc,tc}=evalOU(h,'H');return h.length>=4?(tc>=3&&sc>=9.5):(tc>=3&&sc>=8);}
function aiKontra(q){
  const g=S.game,h=S.hands[q],hs=h.length/8;
  if(g.type==='bettel') return false;
  const tr=h.filter(c=>isT(c)), top4=tr.filter(c=>g.ti.get(c.id)<4).length, aces=h.filter(c=>!isT(c)&&c.r==='A').length;
  if(g.type==='sauspiel') return (tr.length>=5*hs&&top4>=2&&aces>=1)||(tr.length>=6*hs&&top4>=1);
  if(g.type==='wenz'||g.type==='geier') return top4>=2&&aces>=2;
  return tr.length>=4*hs&&top4>=2;
}
function aiRe(q){
  const g=S.game,h=S.hands[q],hs=h.length/8;
  if(g.type==='bettel') return false;
  const tr=h.filter(c=>isT(c)), top4=tr.filter(c=>g.ti.get(c.id)<4).length, aces=h.filter(c=>!isT(c)&&c.r==='A').length;
  if(g.type==='sauspiel') return tr.length>=6*hs&&top4>=2;
  if(g.type==='wenz'||g.type==='geier') return top4>=3&&aces>=2;
  return tr.length>=6*hs&&top4>=3;
}

/* ================= Darstellung ================= */
function cardHTML(c,cls='',tmark=false){
  return `<div class="card ${cls}" data-id="${c.id}"><img src="${cardSrc(c.id)}" alt="${cname(c)}" draggable="false">${tmark?'<span class="tmark"></span>':''}</div>`;
}
function plateHTML(p){
  let tag='';
  if(S&&S.game&&!S.prelim){
    const g=S.game;
    if(g.type!=='ramsch'){
      if(p===g.player) tag='<span class="tag pl">Spieler</span>';
      else if(S.team[p]&&g.type==='sauspiel'&&(S.revealed||p===0||S.phase==='end')) tag='<span class="tag pa">Partner</span>';
    }
  }
  if(S&&p===S.dealer) tag+='<span class="tag dl">Geber</span>';
  const n=S?S.won[p].length:0;
  let pts='';
  if(S&&(settings.showPts||S.phase==='end')) pts=` · ${S.won[p].flat().reduce((s,c)=>s+PTS[c.r],0)} Augen`;
  return `<b>${NAMES[p]}</b>${tag}<span class="tk">${n} ${n===1?'Stich':'Stiche'}${pts}</span>`;
}
function renderSeats(){
  for(let p=1;p<4;p++){
    const el=$('#seat'+p);
    const open=S&&(settings.open||S.phase==='end');
    const cs=el.querySelector('.cards');
    cs.className='cards'+(open?' open':'');

  }

}

  }).join('');

function layoutHand(){
  const h=$('#hand'), cards=[...h.children];
  if(!cards.length) return;
  h.classList.add('nt');
  const W=h.clientWidth, cw=cards[0].offsetWidth, n=cards.length;
  requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.remove('nt')));
  const step=n>1?Math.min(cw*1.04,(W-cw-8)/(n-1)):0;
  const total=cw+step*(n-1), x0=(W-total)/2, mid=(n-1)/2;
  const fan=step<cw*.9;
  cards.forEach((c,i)=>{
    const d=i-mid;
    c.style.setProperty('--x',(x0+i*step).toFixed(1)+'px');
    c.style.setProperty('--rot',fan?(d*2.2).toFixed(2)+'deg':'0deg');
    c.style.setProperty('--dy',fan?(Math.abs(d)*Math.abs(d)*1.1).toFixed(1)+'px':'0px');
    c.style.zIndex=i+1;
  });
}

function humanBid(bids){
  return new Promise(res=>{
    const hand=S.hands[0], calls=callable(hand);
    const ic=s=>`<img src="${suitIcon(s)}" alt="">`;
    const before=bids.length?bids.map(b=>`${NAMES[b.p]}: ${b.d?'hätt a Spiel':'weiter'}`).join(' · '):'Du bist Vorhand und sagst als Erste(r) an.';
    let h=`<h3>Was spielst du?</h3><p class="small">${before}</p>`;
    h+=`<div class="grp"><span>Sauspiel – Sau rufen</span>${['E','G','S'].map(s=>{
      const ok=calls.includes(s);
      const why=hand.some(c=>c.id===s+'A')?'Du hast diese Sau selbst':`Du hast keine ${SN[s]}-Karte (ohne Ober/Unter)`;
      return `<button class="gb" data-t="sauspiel" data-s="${s}" ${ok?'':`disabled title="${why}"`}>${ic(s)}${SN[s]}-Sau</button>`;}).join('')}</div>`;
    h+=`<div class="grp"><span>Farbsolo</span>${SUITS.map(s=>`<button class="gb" data-t="solo" data-s="${s}">${ic(s)}${SN[s]}</button>`).join('')}</div>`;
    const single=[];
    if(settings.wenz) single.push(`<button class="gb" data-t="wenz">Wenz <small>nur Unter</small></button>`);
    if(settings.geier) single.push(`<button class="gb" data-t="geier">Geier <small>nur Ober</small></button>`);
    if(settings.bettel) single.push(`<button class="gb" data-t="bettel">Bettel <small>keinen Stich</small></button>`);
    if(single.length) h+=`<div class="grp"><span>Weitere Spiele</span>${single.join('')}</div>`;
    if(settings.farbwenz) h+=`<div class="grp"><span>Farbwenz</span>${SUITS.map(s=>`<button class="gb" data-t="farbwenz" data-s="${s}">${ic(s)}${SN[s]}</button>`).join('')}</div>`;
    if(settings.farbgeier) h+=`<div class="grp"><span>Farbgeier</span>${SUITS.map(s=>`<button class="gb" data-t="farbgeier" data-s="${s}">${ic(s)}${SN[s]}</button>`).join('')}</div>`;
    if(settings.tout) h+=`<label class="toutline"><input type="checkbox" id="toutChk"> als Tout ansagen (alle Stiche, doppelter Wert)</label>`;
    if(settings.hints){const sg=aiDecide(0);h+=`<p class="sugg">Vorschlag: <b>${sg?gameLabel(sg):'Weiter'}</b></p>`;}
    h+=`<div class="btns"><button class="pri" data-t="weiter">Weiter (nicht spielen)</button></div>`;
    const p=panel(h);
    p.onclick=e=>{
      const b=e.target.closest('button[data-t]');if(!b||b.disabled)return;
      const t=b.dataset.t;closePanel();

      const d={type:t};

      const tc=$('#toutChk');
      if(tc&&tc.checked&&t!=='sauspiel'&&t!=='bettel') d.tout=true;
      res(d);
    };
  });
}
function humanPlay(){return new Promise(res=>{S.humanResolve=res;S.sel=null;S.hint=null;renderHand();renderInfo();});}
function tryPlay(id,force){
  if(!S)return;
  if(!myTurn()){if(S.phase==='play')showMsg('Warte, bis du dran bist.');return;}
  const r=rules(0), el=$(`#hand .card[data-id="${id}"]`);
  if(r.why[id]){showMsg(r.why[id],'warn',4200);if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}return;}
  if(settings.confirm&&!force&&S.sel!==id){S.sel=id;renderHand();return;}
  const c=S.hands[0].find(x=>x.id===id), done=S.humanResolve;
  S.humanResolve=null;S.sel=null;S.hint=null;done(c);
}
let drag=null, swallow=false;
$('#hand').addEventListener('pointerdown',e=>{const el=e.target.closest('.card');if(!el)return;drag={id:el.dataset.id,y:e.clientY,x:e.clientX};});
window.addEventListener('pointerup',e=>{

/* ================= Spielablauf ================= */
function newState(){
  return {dealer,hands:[[],[],[],[]],start:null,trick:[],won:[[],[],[],[]],log:[],played:new Set(),voids:[{},{},{},{}],ledCount:{},
    klopf:0,kontra:0,game:makeGame({type:'sauspiel',called:'E',player:-1}),prelim:true,team:[false,false,false,false],
    revealed:false,davon:false,rufLed:false,lastTrick:null,turn:-1,phase:'deal',humanResolve:null,sel:null,hint:null};
}
function startGame(){
  gen++;closePanel();closeModal();
  run().catch(e=>{if(e!==ABORT){console.error(e);showMsg('Fehler: '+e.message,'warn',8000);}});
}
async function run(){
  buildDeck();
  dealer=(dealer+1)%4;saveAll();
  S=newState();
  const deck=shuffle(DECK.slice()), n=deck.length/4, half=n/2;
  const full=[0,1,2,3].map(i=>deck.slice(i*n,(i+1)*n));
  for(let p=0;p<4;p++){S.hands[p]=full[p].slice(0,half);sortHand(S.hands[p]);}
  renderAll();showMsg(`${dealer===0?'Du gibst':NAMES[dealer]+' gibt'}. Vorhand ist ${(dealer+1)%4===0?'du':NAMES[(dealer+1)%4]}.`);
  await sleep(600);
  const order=[1,2,3,4].map(i=>(dealer+i)%4);
  if(settings.klopfen){
    for(const p of order){
      let k;
      if(p===0) k=(await askButtons('Klopfen?',`Du siehst die ersten ${half} Karten. Klopfen verdoppelt den Wert des Spiels.`,[['n','Nicht klopfen'],['k','Klopfen']]))==='k';
      else {await sleep(300);k=aiKlopf(p);}
      if(k){S.klopf++;bubble(p,'Klopf, klopf!');renderInfo();}
    }
  }
  for(let p=0;p<4;p++){S.hands[p]=full[p].slice();sortHand(S.hands[p]);}
  S.start=full.map(h=>h.slice());
  renderAll();await sleep(450);

  if(!settings.kurz) for(let p=0;p<4;p++){
    if(full[p].filter(c=>c.r==='O'||c.r==='U').length===8){
      S.game=makeGame({type:'solo',suit:'H',player:p,tout:true});S.game.sie=true;S.prelim=false;
      setTeams();bubble(p,'Sie!');S.phase='end';renderAll();await sleep(1400);
      return finish();
    }
  }

  S.phase='bid';renderInfo();
  const bids=[];
  for(const p of order){
    S.turn=p;renderSeats();
    let d;
    if(p===0) d=await humanBid(bids);
    else {await sleep(650);d=aiDecide(p);}
    bids.push({p,d});
    bubble(p,d?'I hätt a Spiel':'Weiter');
  }
  S.turn=-1;
  const wants=bids.filter(b=>b.d);
  if(!wants.length){
    if(settings.ramsch){
      S.game=makeGame({type:'ramsch',player:-1});S.prelim=false;
      await sleep(500);showMsg('Keiner spielt: Es wird geramscht. Wer die meisten Augen hat, verliert.','',4500);
    }else{
      await sleep(700);S.phase='end';renderAll();
      panel(`<h3>Zusammengeworfen</h3><p>Keiner wollte spielen. Die Karten werden neu gegeben, der nächste Spieler gibt.</p><div class="btns"><button class="pri" id="again">Neu geben</button></div>`);
      $('#again').onclick=startGame;return;
    }
  }else{
    let best=wants[0];
    for(const b of wants) if(declRank(b.d)>declRank(best.d)) best=b;
    S.game=makeGame(Object.assign({},best.d,{player:best.p}));S.prelim=false;
    await sleep(500);
    bubble(best.p,announceText(S.game));
    const human=wants.find(b=>b.p===0);
    if(human&&best.p!==0) showMsg(`${NAMES[best.p]} spielt ${gameLabel(S.game)}. Das geht vor (höheres Spiel oder Vorrang durch Sitzposition).`,'',5000);
    else if(best.p!==0) showMsg(`${NAMES[best.p]} spielt ${gameLabel(S.game)}.`);
  }
  setTeams();
  for(let p=0;p<4;p++) sortHand(S.hands[p]);
  renderAll();
  if(S.game.type==='sauspiel'&&S.team[0]&&S.game.player!==0){await sleep(400);showMsg(`Du hast die ${SN[S.game.called]}-Sau: Du spielst heimlich mit ${NAMES[S.game.player]}.`,'tip',5000);}
  await sleep(900);
  if(settings.kontra&&S.game.type!=='ramsch') await kontraPhase(order);

  S.phase='play';
  let leader=(dealer+1)%4;
  const nT=S.hands[0].length;
  for(let t=0;t<nT;t++){
    S.trick=[];renderTrick();
    for(let k=0;k<4;k++){
      const p=(leader+k)%4;S.turn=p;renderSeats();renderInfo();
      let c;
      if(p===0) c=await humanPlay();
      else {await sleep(620);c=aiPlay(p);}
      S.justRevealed=-1;S.justRan=-1;
      applyCard(p,c);
      $('#trick').insertAdjacentHTML('beforeend',slotHTML(p,c,true));
      renderHand();renderSeats();
      if(S.justRan>=0) {bubble(p,'Davongelaufen!');showMsg(`${NAMES[p]} läuft mit der Ruffarbe davon (mindestens ${settings.kurz?3:4} Karten).`);}
      if(S.justRevealed>=0&&S.game.player!==p) showMsg(`${p===0?'Du hast':NAMES[p]+' hat'} die gerufene Sau: Partner von ${S.game.player===0?'dir':NAMES[S.game.player]}.`);
    }
    S.turn=-1;renderSeats();renderInfo();
    const wi=trickWinnerIdx(S.trick), w=S.trick[wi].p;
    $('#trick').querySelector(`.slot[data-p="${w}"]`).classList.add('win');
    await sleep(950);
    const tt=$('#trick');tt.classList.add('go','g'+w);
    await sleep(480);
    S.won[w].push(S.trick.map(x=>x.c));
    S.lastTrick={cards:S.trick.slice(),w};S.log.push(S.lastTrick);
    S.trick=[];renderTrick();renderSeats();renderInfo();
    leader=w;
    if(S.game.type==='bettel'&&w===S.game.player){showMsg(`${w===0?'Du hast':NAMES[w]+' hat'} einen Stich bekommen. Der Bettel ist verloren.`);break;}
    if(S.game.tout&&!S.team[w]){showMsg('Die Gegner haben einen Stich. Das Tout ist verloren.');break;}
  }
  S.phase='end';renderAll();
  await sleep(500);
  finish();
}
function setTeams(){
  const g=S.game;
  for(let p=0;p<4;p++){
    if(g.type==='ramsch') S.team[p]=false;
    else if(g.type==='sauspiel') S.team[p]=p===g.player||S.start[p].some(c=>c.id===g.called+'A');
    else S.team[p]=p===g.player;
  }
}
async function kontraPhase(order){
  const g=S.game;let k=false;
  for(const q of order){
    if(S.team[q]) continue;
    if(q===0) k=(await askButtons('Kontra?',`${g.player===0?'Du spielst':NAMES[g.player]+' spielt'} ${gameLabel(g)}. Glaubst du, die Gegenpartei gewinnt? Kontra verdoppelt den Wert.`,[['n','Kein Kontra'],['k','Kontra!']]))==='k';
    else {await sleep(250);k=aiKontra(q);}
    if(k){S.kontra=1;bubble(q,'Kontra!');renderInfo();break;}
  }
  if(!k) return;
  await sleep(700);
  for(const q of order){
    if(!S.team[q]) continue;
    let r;
    if(q===0) r=(await askButtons('Re?','Die Gegner haben Kontra gegeben. Mit Re verdoppelst du noch einmal.',[['n','Kein Re'],['r','Re!']]))==='r';
    else {await sleep(250);r=aiRe(q);}
    if(r){S.kontra=2;bubble(q,'Re!');renderInfo();break;}
  }
}
function laufende(){
  const g=S.game, tr=g.trumps;
  if(!tr.length) return {n:0};
  const owner=id=>S.start.findIndex(h=>h.some(c=>c.id===id));
  const first=S.team[owner(tr[0])];
  let n=0;for(const id of tr){const o=owner(id);if(o>=0&&S.team[o]===first)n++;else break;}
  return {n,mit:first};
}

/* ================= Abrechnung ================= */
function settle(){
  const g=S.game, T={sau:+settings.tSau,solo:+settings.tSolo,schn:+settings.tSchn,lauf:+settings.tLauf};
  const P=[0,1,2,3].map(p=>S.won[p].flat().reduce((s,c)=>s+PTS[c.r],0)), K=[0,1,2,3].map(p=>S.won[p].length);
  const mult=2**(S.klopf+S.kontra), pay=[0,0,0,0], lines=[];
  let head='', win=null;
  if(g.type==='ramsch'){
    const all=K.findIndex(k=>k===K.reduce((a,b)=>a+b,0)&&k>0);
    if(all>=0){
      const v=T.solo*mult;
      for(let p=0;p<4;p++) pay[p]=p===all?3*v:-v;
      head=`Durchmarsch! ${all===0?'Du hast':NAMES[all]+' hat'} alle Stiche und gewinnt.`;
      lines.push(['Durchmarsch (Solotarif)',T.solo]);
    }else{
      const max=Math.max(...P);let losers=[0,1,2,3].filter(p=>P[p]===max);
      if(losers.length>1){const mt=Math.max(...losers.map(p=>K[p]));losers=losers.filter(p=>K[p]===mt);}
      const jung=[0,1,2,3].filter(p=>K[p]===0).length;
      const v=T.sau*2**jung*mult;
      for(const l of losers) for(let p=0;p<4;p++) if(!losers.includes(p)){pay[l]-=v;pay[p]+=v;}
      head=`${losers.map(l=>l===0?'Du':NAMES[l]).join(' und ')} ${losers.length>1?'verlieren':losers[0]===0?'verlierst':'verliert'} den Ramsch mit ${max} Augen.`;
      lines.push(['Grundtarif (Sauspiel)',T.sau]);
      if(jung) lines.push([`${jung} Jungfrau${jung>1?'en':''} (ohne Stich)`,`×${2**jung}`]);
    }
    if(S.klopf) lines.push([`${S.klopf}× geklopft`,`×${2**S.klopf}`]);
    win=pay[0]>0;
  }else{
    const party=[0,1,2,3].filter(p=>S.team[p]), opp=[0,1,2,3].filter(p=>!S.team[p]);
    const pp=party.reduce((s,p)=>s+P[p],0), op=opp.reduce((s,p)=>s+P[p],0);
    const pk=party.reduce((s,p)=>s+K[p],0), ok=opp.reduce((s,p)=>s+K[p],0);
    let schn=false,schw=false;
    if(g.sie) win=true;
    else if(g.type==='bettel') win=pk===0;
    else if(g.tout) win=ok===0;
    else{win=pp>=61;schn=win?pp>=91:pp<=30;schw=win?ok===0:pk===0;}
    const base=g.type==='sauspiel'?T.sau:T.solo;let v=base;
    lines.push([`Grundtarif ${g.type==='sauspiel'?'Sauspiel':'Solo'}`,base]);
    if(g.type!=='bettel'){
      if(schn){v+=T.schn;lines.push(['Schneider',T.schn]);}
      if(schw){v+=T.schn;lines.push(['Schwarz',T.schn]);}
      const L=laufende(), min=(g.type==='wenz'||g.type==='geier')?+settings.laufWG:+settings.laufOU;
      if(L.n>=min){v+=L.n*T.lauf;lines.push([`${L.n} Laufende (${L.mit?'mit':'ohne'} ${L.n})`,L.n*T.lauf]);}
    }
    if(g.tout){v*=2;lines.push([g.sie?'Sie: zählt wie Tout ×2':'Tout ×2','×2']);}
    if(g.sie){v*=2;lines.push(['Sie: noch einmal ×2','×2']);}
    if(S.klopf) lines.push([`${S.klopf}× geklopft`,`×${2**S.klopf}`]);
    if(S.kontra) lines.push([S.kontra===2?'Kontra und Re':'Kontra',`×${2**S.kontra}`]);
    v*=mult;
    if(g.type==='sauspiel'){for(const p of party)pay[p]=win?v:-v;for(const o of opp)pay[o]=win?-v:v;}
    else{pay[g.player]=win?3*v:-3*v;for(const o of opp)pay[o]=win?-v:v;}
    const who=party.map(p=>p===0?'Du':NAMES[p]).join(' und ');
    const verb=party.length>1?(win?'gewinnen':'verlieren'):(party[0]===0?(win?'gewinnst':'verlierst'):(win?'gewinnt':'verliert'));
    if(g.sie) head=`${who} ${party[0]===0?'hast':'hat'} Sie: alle Ober und Unter. Sofort gewonnen!`;
    else if(g.type==='bettel'||g.tout) head=`${who} ${verb} ${gameLabel(g)}.`;
    else head=`${who} ${verb} mit ${pp} zu ${op} Augen${schw?' – schwarz':schn?' – Schneider':''}.`;
    win=S.team[0]?win:!win;
  }
  return {pay,lines,head,P,K,win};
}
function finish(){
  const r=settle(), g=S.game;
  for(let p=0;p<4;p++) totals[p]+=r.pay[p];
  history.unshift({label:gameLabel(g),player:g.player,pay:r.pay,head:r.head});
  history=history.slice(0,200);
  wallet.bal+=r.pay[0];wallet.games++;if(r.pay[0]>0)wallet.won++;

function setOpt(k,v){
  settings[k]=v;
  if(k==='stake'){const st=STAKES.find(x=>x.k===v);if(st){settings.tSau=st.sau;settings.tSolo=st.solo;settings.tSchn=st.sau;settings.tLauf=st.sau;}}
  if(['tSau','tSolo','tSchn','tLauf'].includes(k)){const st=STAKES.find(x=>x.sau===settings.tSau&&x.solo===settings.tSolo&&settings.tSchn===x.sau&&settings.tLauf===x.sau);settings.stake=st?st.k:'custom';}
  saveAll();renderAll();refreshSheet();
}
$('#sheet').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.k){setOpt(t.dataset.k,t.checked);}
});
$('#sheet').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.m){const m=b.dataset.m;
    if(m==='new') startGame();
    else if(OPEN[m]) OPEN[m]();
    else if(m==='reset'){const keep={startMoney:settings.startMoney};settings=Object.assign({},DEF,keep);saveAll();renderAll();refreshSheet();showMsg('Standard-Einstellungen wiederhergestellt.');}
    else if(m==='clear'){totals=[0,0,0,0];history=[];saveAll();refreshSheet();renderAll();}
    else if(m==='rebuy'){rebuy();refreshSheet();}
    else if(m==='restart'){wallet={bal:settings.startMoney,rebuys:0,games:0,won:0,best:0,worst:0};saveAll();renderWallet();refreshSheet();}
    else if(m==='deckAll'){$('#filePickMulti').click();}
    else if(m==='deckClear'){for(const id of Object.keys(OWN))await IDB.put(id,null);await loadOwnDeck();refreshSheet();showMsg('Eigene Kartenbilder entfernt.');}
    return;}
  if(b.dataset.seg){let v=b.dataset.val;if(v==='true')v=true;else if(v==='false')v=false;else if(/^\d+$/.test(v))v=+v;setOpt(b.dataset.seg,v);return;}
  if(b.dataset.step){const k=b.dataset.step;setOpt(k,Math.max(0,(+settings[k])+(+b.dataset.d)));return;}
  if(b.dataset.stake){setOpt('stake',b.dataset.stake);return;}
  if(b.dataset.slot){pickSlot=b.dataset.slot;$('#filePick').value='';$('#filePick').click();return;}
});

});
$('#filePickMulti').addEventListener('change',async e=>{
  const files=[...e.target.files];let ok=0;const miss=[];

});

const INSTALL=`<p style="margin-top:12px">Auf dem iPhone und iPad kannst du Schafkopf wie eine App auf den Home-Bildschirm legen. Dann startet es im Vollbild ohne Adressleiste.</p>
<h3>So geht's in Safari</h3>

const RULES=`<p style="margin-top:12px">Bayerischer Schafkopf wird zu viert gespielt. Du sitzt unten, im Uhrzeigersinn folgen Sepp (links), Resi (oben) und Franz (rechts).</p>
<h3>Karten und Augen</h3>
<p>Gespielt wird mit dem bayerischen Blatt in den Farben Eichel, Gras, Herz und Schellen. Lange Karte: 32 Karten, jeder bekommt 8. Kurze Karte: 24 Karten ohne Sieben und Acht, jeder bekommt 6.</p>
<p>Augen: Sau 11, Zehn 10, König 4, Ober 3, Unter 2, Neun/Acht/Sieben 0. Im ganzen Spiel gibt es 120 Augen.</p>
<h3>Trumpf im Normalspiel</h3>
<p>Beim Sauspiel (und beim Ramsch) sind Trumpf, von hoch nach niedrig: Eichel-Ober, Gras-Ober, Herz-Ober, Schellen-Ober, Eichel-Unter, Gras-Unter, Herz-Unter, Schellen-Unter, dann Herz-Sau, Herz-Zehn, Herz-König, Herz-Neun, Herz-Acht, Herz-Sieben. In den übrigen Farben gilt: Sau, Zehn, König, Neun, Acht, Sieben.</p>
<h3>Ablauf</h3>
<ul><li>Der Geber wechselt reihum. Links vom Geber sitzt die Vorhand: Sie sagt zuerst an und spielt die erste Karte aus.</li>
<li>Bei „Klopfen“ bekommt jeder zuerst die Hälfte der Karten und darf klopfen. Jedes Klopfen verdoppelt den Spielwert.</li>
<li>Reihum sagt jeder „Weiter“ oder „I hätt a Spiel“. Wollen mehrere spielen, gewinnt das höhere Spiel: Sauspiel &lt; Bettel &lt; Solo, Wenz, Geier, Farbwenz, Farbgeier &lt; Tout. Bei gleich hohen Spielen hat der Vordere Vorrang.</li>
<li>Will keiner spielen, wird zusammengeworfen oder (je nach Einstellung) geramscht.</li></ul>
<h3>Zugeben</h3>
<ul><li>Wird Trumpf ausgespielt, musst du Trumpf zugeben, wenn du einen hast.</li>
<li>Wird eine Farbe ausgespielt, musst du diese Farbe zugeben. Ober und Unter zählen dabei nicht zur Farbe, sie sind Trumpf.</li>
<li>Kannst du nicht zugeben, darfst du stechen oder eine beliebige Karte abwerfen. Es gibt keinen Stichzwang.</li>
<li>Den Stich macht der höchste Trumpf, sonst die höchste Karte der ausgespielten Farbe. Wer sticht, spielt als Nächstes aus.</li></ul>
<h3>Sauspiel (Rufspiel)</h3>
<ul><li>Der Spieler ruft eine Sau (Eichel, Gras oder Schellen, nie Herz). Wer sie hat, ist sein geheimer Partner. Erst wenn die Sau fällt, wissen alle Bescheid.</li>
<li>Rufen darf man nur eine Farbe, von der man selbst mindestens eine Karte hat (ohne Ober und Unter), und nicht die eigene Sau.</li>
<li>Wird die Ruffarbe zum ersten Mal ausgespielt („die Sau wird gesucht“), muss der Partner die gerufene Sau zugeben.</li>
<li>Der Partner darf die gerufene Sau nicht abwerfen, außer im letzten Stich.</li>
<li>Der Partner darf die Ruffarbe nur mit der Sau ausspielen. Ausnahme Davonlaufen: Wer mindestens 4 Karten der Ruffarbe hat (kurze Karte: 3), darf eine andere Karte dieser Farbe ausspielen.</li>
<li>Spieler und Partner brauchen zusammen mindestens 61 Augen. Bei 60 haben die Gegner gewonnen.</li></ul>
<h3>Solospiele</h3>
<ul><li><b>Farbsolo:</b> wie Sauspiel, aber die gewählte Farbe statt Herz ist Trumpf. Der Spieler spielt allein gegen drei.</li>
<li><b>Wenz:</b> nur die vier Unter sind Trumpf. Die Ober stehen in ihrer Farbe zwischen König und Neun.</li>
<li><b>Geier:</b> nur die vier Ober sind Trumpf. Die Unter stehen in ihrer Farbe.</li>
<li><b>Farbwenz / Farbgeier:</b> Unter bzw. Ober und zusätzlich eine Farbe sind Trumpf.</li>
<li><b>Bettel:</b> Der Spieler darf keinen einzigen Stich machen. Es gibt keinen Trumpf, Reihenfolge je Farbe: Sau, König, Ober, Unter, Zehn, Neun, Acht, Sieben.</li>
<li><b>Tout:</b> Ansage zu einem Solo, Wenz oder Geier, alle Stiche zu machen. Gelingt es, zählt das Spiel doppelt. Geht ein Stich verloren, ist es verloren.</li>
<li><b>Sie:</b> Wer alle vier Ober und alle vier Unter hat, gewinnt sofort, mit vierfachem Solowert.</li></ul>
<h3>Schneider, Schwarz, Laufende</h3>
<ul><li><b>Schneider:</b> Die Verlierer haben 30 Augen oder weniger (Spieler gewinnt mit 91 oder mehr, Gegner gewinnen, wenn der Spieler höchstens 30 hat).</li>
<li><b>Schwarz:</b> Die Verlierer haben keinen einzigen Stich gemacht.</li>
<li><b>Laufende:</b> die höchsten Trümpfe in ununterbrochener Reihe bei einer Partei („mit drei“ oder „ohne drei“). Sie zählen beim Sauspiel und Solo ab 3, beim Wenz und Geier ab 2 (einstellbar).</li></ul>
<h3>Abrechnung</h3>
<ul><li>Spielwert = Grundtarif + Schneider + Schwarz + Laufende, verdoppelt durch Tout, jedes Klopfen, Kontra und Re.</li>
<li>Sauspiel: Jeder der beiden Verlierer zahlt einem Gewinner den Spielwert.</li>
<li>Solo, Wenz, Geier, Bettel: Der Spieler bekommt den Wert von jedem der drei Gegner oder zahlt ihn an jeden.</li></ul>
<h3>Ramsch</h3>
<p>Spielt keiner, kann geramscht werden. Trumpf wie beim Sauspiel, jeder spielt für sich. Wer die meisten Augen hat, verliert und zahlt jedem anderen den Sauspieltarif. Bei Gleichstand verliert, wer mehr Stiche hat. Jede „Jungfrau“ (Spieler ohne Stich) verdoppelt. Macht einer alle Stiche (Durchmarsch), gewinnt er wie bei einem Solo.</p>
<h3>Übungshilfen</h3>
<p><kbd>Tipp</kbd> (Glühbirne) schlägt dir eine Karte vor und erklärt warum. Nicht erlaubte Karten werden abgedunkelt. Tippst du trotzdem darauf, steht da, welche Regel es verbietet. Der Stapel zeigt den letzten Stich.</p>
<p class="credit">Kartenbilder: eigene Zeichnung im Stil des bayerischen Blatts.</p>`;
